# all the guesses, change here or via cli flags
hours_per_month: 730             # 365 days * 24 h / 12. Every bill is scaled to this.
fx_to_usd: {USD: 1.0, INR: 0.012}   # bills in other currencies are converted with this

confidence_band:                 # how wide the low..high range is per confidence label
  exact: 0.05                    # +/- 5%
  close: 0.20                    # +/- 20%
  assumed: 0.30                  # +/- 30% (we copied the AWS cost)
  human: 0.50                    # +/- 50% (nobody knows yet)

gcp:
  cud: none                      # --gcp-cud none|1y|3y
  network_tier: premium          # --network-tier premium|standard
  perf_factor: 1.0               # --perf-factor  (1.2 = GCP needs 20% more compute)
  gke_free_cluster: true         # --no-gke-free-cluster (GKE: one cluster's fee free)
  support_pct: 0.03              # GCP support = 3% of spend ...
  support_min_monthly: 29        # ... but at least this much
  credits_usd: 0                 # --gcp-credits

aws:
  optimisation_pct: 0.15         # rough share of an AWS bill that cleanup removes
  retention_discount_pct: 0      # --aws-retention-discount (AWS offer to stay)

migration:
  overlap_months: 1              # --overlap-months (months paying both clouds)
  egress_usd_per_gb: 0.09        # AWS charge to copy data out (approx, unverified for Mumbai)
  egress_waived: false           # --egress-waived (AWS waives it if you ask Support)
  archive_retrieval_usd_per_gb: 0.02
  band: 0.30                     # one-time cost range +/- 30%
  labor:
    rate_usd_per_hour: 30        # --labor-rate
    base_project_hours: 80       # planning, IaC, CI/CD, IAM, testing
    hours_per_resource:          # per distinct resource found in the bill
      compute: 4
      storage: 1
      database: 16
      network: 4
      kubernetes: 40
      dns: 2
      managed: 8
    hours_per_human_item: 16     # each "needs a human" item

